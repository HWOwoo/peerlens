[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerlens"
version = "0.1.0"
description = "공시 근거 기반 글로벌 Peer 비교·투자메모 AI Agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
peerlens = "peerlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real SEC API (run with -m live)"]
addopts = "-m 'not live'"
